<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест Техкарты (Все блоки)</title>
  <style>
    :root { --accent: #5b8cff; --bg: #0f1116; --card-bg: #1a1d25; --border: #333; --text: #fff; --text-muted: #aaa; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 100px; }
    
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; max-width: 1100px; margin: 0 auto; overflow: hidden; }
    .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px; }
    
    .block-card { background: #15171e; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
    .block-header { background: rgba(91, 140, 255, 0.1); padding: 12px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .block-title { font-size: 16px; font-weight: bold; color: var(--accent); }
    .block-meta { font-size: 12px; background: #333; padding: 4px 8px; border-radius: 4px; }
    
    .sub-title { font-size: 14px; font-weight: bold; color: #aaa; margin: 20px 0 10px; border-bottom: 1px dashed #444; padding-bottom: 5px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; table-layout: fixed; }
    th { text-align: left; padding: 8px; background: #222; color: #aaa; border: 1px solid #444; font-weight: normal; word-break: break-word; }
    td { padding: 8px; border: 1px solid #444; word-break: break-word; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    
    .summary { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; border: 1px solid #444; margin-top: 20px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .summary-row.total { color: #ff9f43; font-size: 15px; font-weight: bold; border-top: 1px dashed #555; padding-top: 8px; }
    .summary-row.final { color: #31d0aa; font-size: 18px; font-weight: bold; margin-top: 10px; }
    
    .controls { display: flex; align-items: center; gap: 10px; }
    .controls input[type="number"] { background: #0f1116; border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px; width: 80px; text-align: right; }
    .controls input[type="number"]:focus { outline: none; border-color: var(--accent); }
    
    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    .error-box { background: #ff4444; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>

  <div class="modal">
    <div class="modal-header">
      <h2 style="margin: 0; font-size: 20px;">📊 Технологическая карта (Полный тест)</h2>
    </div>
    <div class="modal-body" id="techCardBody">
      <div style="text-align: center; color: #aaa; padding: 20px;">Загрузка данных...</div>
    </div>
  </div>

  <div class="footer">
    <div style="display: flex; gap: 20px; align-items: center;">
      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="globalUsn" onchange="renderTechCard()"> УСН 6%
      </label>
      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; color: #ff9f43;">
        <input type="checkbox" id="globalPaint" checked onchange="renderTechCard()"> Красим всё
      </label>
      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; color: #ff9f43;">
        <input type="checkbox" id="globalMount" checked onchange="renderTechCard()"> Монтируем всё
      </label>
      <div style="font-size: 16px; font-weight: bold; margin-left: 20px;">
        ИТОГО: <span id="grandTotal" style="color: #31d0aa;">0.00 ₽</span>
      </div>
    </div>
    <button class="btn">🖨️ Печать</button>
  </div>

  <script>
    const xmlString = `
      <details>
        <!-- Ступени -->
        <detail name="1_Tr1"><type id="Step">Ступень</type><attributes><attribute name="subtype" value="straight"/></attributes><dim text=""><length>945</length><width>431</width></dim><material>PINE</material></detail>
        <detail name="1_Tr2"><type id="Step">Ступень</type><attributes><attribute name="subtype" value="winder"/></attributes><dim text=""><length>1206</length><width>584</width></dim><material>PINE</material></detail>
        
        <!-- Подступенки -->
        <detail name="1_Ri1"><type id="Riser">Подступенок</type><dim text=""><length>838</length><width>148</width></dim><material>PINE</material></detail>
        
        <!-- Тетивы -->
        <detail name="1_St1L"><type id="String">Тетива</type><dim text=""><length>2141</length><width>645</width></dim><material>PINE</material></detail>
        
        <!-- Столбы -->
        <detail name="1_SP1"><type id="Newel">Столбы</type><dim text=""><length>2000</length><width>80</width></dim><material>PINE</material></detail>
        
        <!-- Балясины -->
        <detail name="1_Ba1"><type id="Baluster">Балясина</type><dim text=""><length>870</length><width>30</width></dim><typename>Bal01</typename><material>PINE</material></detail>
      </details>
    `;

    const dxfAreas = { 
      "1_Tr1": 0.35, "1_Tr2": 0.50, "1_Ri1": 0.12, "1_St1L": 1.20, "1_SP1": 0.25, "1_Ba1": 0.08
    };

    let prices = null;
    let state = { markup: null, mountAddon: 0 };

    async function init() {
      try {
        const res = await fetch('production_prices.json');
        if (!res.ok) throw new Error("Файл JSON не найден.");
        prices = await res.json();
        state.markup = prices.settings?.markup_percent || 40;
        renderTechCard();
      } catch (e) {
        document.getElementById('techCardBody').innerHTML = `<div class="error-box">Ошибка: ${e.message}</div>`;
      }
    }

    function renderTechCard() {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        const details = xmlDoc.getElementsByTagName("detail");

        const isPaintGlobal = document.getElementById('globalPaint').checked;
        const isMountGlobal = document.getElementById('globalMount').checked;
        const isUsnGlobal = document.getElementById('globalUsn').checked;

        let blocks = {
          Step: { name: 'Ступени', items: [], area: 0, wood: 0, works: 0, paint: 0 },
          Riser: { name: 'Подступенки', items: [], area: 0, wood: 0, works: 0, paint: 0 },
          String: { name: 'Тетивы', items: [], area: 0, wood: 0, works: 0, paint: 0 },
          Newel: { name: 'Столбы', items: [], area: 0, wood: 0, works: 0, paint: 0 },
          Baluster: { name: 'Балясины', items: [], area: 0, wood: 0, works: 0, paint: 0 }
        };

        for (let i = 0; i < details.length; i++) {
          const el = details[i];
          const typeId = el.getElementsByTagName("type")[0].getAttribute("id");
          if (!blocks[typeId]) continue;

          const name = el.getAttribute("name");
          const subtype = el.getElementsByTagName("attribute")[0] ? el.getElementsByTagName("attribute")[0].getAttribute("value") : "straight";
          const length = parseFloat(el.getElementsByTagName("length")[0].textContent);
          const width = parseFloat(el.getElementsByTagName("width")[0].textContent);
          const model = el.getElementsByTagName("typename")[0]?.textContent || "";

          const materialKey = "pine"; 
          const woodName = prices.woods[materialKey] ? prices.woods[materialKey].name : "Сосна";
          const woodPrice = prices.woods[materialKey] ? prices.woods[materialKey].pricePerM3 : 0;
          const woodCoef = prices.woods[materialKey] ? prices.woods[materialKey].workCoef : 1.0;
          
          let volume = 0;
          let lathsCount = 0;
          let lathDims = "";

          // --- ЛОГИКА ЗАГОТОВОК ---
          if (typeId === 'Step' || typeId === 'Riser' || typeId === 'String') {
            lathsCount = Math.ceil(width / 45);
            const purchaseLength = Math.ceil((length + 100) / 50) * 50;
            volume = (purchaseLength * 50 * 50 * lathsCount) / 1000000000;
            lathDims = `50×50×${purchaseLength}`;
          } 
          else if (typeId === 'Newel') {
            // СТОЛБЫ: 2 доски 50х100
            lathsCount = 2; 
            const purchaseLength = Math.ceil((length + 100) / 50) * 50;
            volume = (purchaseLength * 50 * 100 * 2) / 1000000000;
            lathDims = `50×100×${purchaseLength}`; // Пишем размер ОДНОЙ доски
          }
          else if (typeId === 'Baluster') {
            lathsCount = 1;
            const purchaseLength = Math.ceil((length + 40) / 10) * 10;
            volume = (purchaseLength * 50 * 50) / 1000000000;
            lathDims = `50×50×${purchaseLength}`;
          }

          const woodCost = volume * woodPrice;
          
          const area = dxfAreas[name] || 0;
          const paintArea = area * 2;
          blocks[typeId].area += paintArea;
          blocks[typeId].wood += woodCost;

          const coefType = subtype === "winder" ? "Step_winder" : (typeId + "_straight");
          const complexityCoef = prices.detail_coefficients[coefType]?.coef || prices.detail_coefficients[typeId]?.coef || 1.0;

          const glueKey = (volume > 0.01 || typeId === 'Newel') ? "glue_long" : "glue_short";
          const cGlue = (prices.works[glueKey]?.perUnit || 0) * paintArea * complexityCoef * woodCoef;
          const cCncUp = (prices.works.cnc_programming?.perUnit || 0) * complexityCoef;
          const cCncCut = (prices.works.cnc_cutting?.perUnit || 0) * complexityCoef;
          const cSanding = (prices.works.sanding?.perUnit || 0) * paintArea * complexityCoef * woodCoef;
          
          let cTurning = 0;
          if (typeId === 'Baluster') {
             cTurning = prices.turnings[model.toLowerCase()]?.pricePerPcs || 0;
          }

          blocks[typeId].works += (cGlue + cCncUp + cCncCut + cSanding + cTurning);

          blocks[typeId].items.push({
            name, subtype, woodName, 
            dims: `${length}×${width}`, 
            lathDims, lathsCount, volume, woodCost, model
          });
        }

        let recipe = Object.values(prices.paint_recipes || {}).find(r => r.name.includes("Белый")) || Object.values(prices.paint_recipes || {})[0];
        
        Object.keys(blocks).forEach(key => {
          let block = blocks[key];
          if (!recipe || !isPaintGlobal) return;

          const processBlock = (paintBlock) => {
            if (!paintBlock || !paintBlock.enabled) return 0;
            let totalVol = 0, totalPrice = 0;
            paintBlock.components.forEach(c => {
              totalVol += c.volume;
              const inv = prices.paint_inventory[c.component];
              if (inv) totalPrice += (c.volume * (inv.pricePerLiter / 1000));
            });
            const mixtureNeeded = paintBlock.consumption * block.area;
            const pricePerMl = totalVol > 0 ? totalPrice / totalVol : 0;
            return pricePerMl * mixtureNeeded;
          };

          block.paint = processBlock(recipe.stain) + processBlock(recipe.primer) + processBlock(recipe.lacquer);
        });

        let totalProjectCost = 0;
        let totalProjectMarkup = 0;
        let htmlBlocks = '';

        Object.keys(blocks).forEach(typeId => {
          const b = blocks[typeId];
          if (b.items.length === 0) return;

          const baseCost = b.wood + b.works;
          const mountingBase = (prices.works.mounting?.base || 0) + ((prices.works.mounting?.perUnit || 0) * b.area);
          const activeMount = isMountGlobal ? (mountingBase + state.mountAddon) : 0;
          
          const totalBeforeMarkup = baseCost + b.paint + activeMount;
          const markupCost = totalBeforeMarkup * (state.markup / 100);
          
          totalProjectCost += totalBeforeMarkup;
          totalProjectMarkup += markupCost;

          let rowsHTML = '';
          b.items.forEach(item => {
            rowsHTML += `<tr>
              <td>${item.name}</td>
              <td>${item.subtype === 'winder' ? 'Забежная' : 'Прямая'}</td>
              <td>${item.woodName}</td>
              <td>${item.dims}</td>
              <td class="text-center">${item.lathDims}</td>
              <td class="text-center">${item.lathsCount} шт</td>
              <td>${item.volume.toFixed(4)}</td>
              <td class="text-right">${item.woodCost.toFixed(2)} ₽</td>
            </tr>`;
          });

          htmlBlocks += `
            <div class="block-card">
              <div class="block-header">
                <div class="block-title">📦 БЛОК: ${b.name.toUpperCase()} (${b.items.length} шт)</div>
                <div class="block-meta">🎨 Покраска: ${isPaintGlobal && recipe ? recipe.name : 'Отключена'}</div>
              </div>
              <div style="padding: 15px;">
                <div class="sub-title">1. Детали и Дерево</div>
                <table>
                  <tr><th>Деталь</th><th>Тип</th><th>Дерево</th><th>Габариты</th><th class="text-center">Заготовка</th><th class="text-center">Шт</th><th>Объем</th><th class="text-right">Стоимость</th></tr>
                  ${rowsHTML}
                </table>
                
                <div class="summary" style="margin-top: 10px;">
                  <div class="summary-row"><span>Итого дерево:</span> <b>${b.wood.toFixed(2)} ₽</b></div>
                  <div class="summary-row"><span>Итого работы:</span> <b>${b.works.toFixed(2)} ₽</b></div>
                  <div class="summary-row"><span>Покраска:</span> <b>${b.paint.toFixed(2)} ₽</b></div>
                  <div class="summary-row"><span>Монтаж:</span> <b>${isMountGlobal ? (mountingBase + state.mountAddon).toFixed(2) : 'Отключен'} ₽</b></div>
                  <div class="summary-row total"><span>СЕБЕСТОИМОСТЬ БЛОКА:</span> <span>${totalBeforeMarkup.toFixed(2)} ₽</span></div>
                  <div class="summary-row final"><span>ЦЕНА БЛОКА:</span> <span>${(totalBeforeMarkup + markupCost).toFixed(2)} ₽</span></div>
                </div>
              </div>
            </div>
          `;
        });

        const usnPercent = prices.settings?.usn_percent || 6;
        const usnCost = isUsnGlobal ? (totalProjectCost + totalProjectMarkup) * (usnPercent / 100) : 0;
        const finalGrandTotal = totalProjectCost + totalProjectMarkup + usnCost;

        document.getElementById('grandTotal').innerText = finalGrandTotal.toFixed(2) + ' ₽';
        
        htmlBlocks += `
          <div class="summary" style="background: #1a1d25; border: 2px solid var(--accent);">
            <h3 style="margin-top:0; color: var(--accent);">ИТОГО ПО ПРОЕКТУ</h3>
            <div class="summary-row"><span>Общая себестоимость:</span> <b>${totalProjectCost.toFixed(2)} ₽</b></div>
            <div class="summary-row"><span>Общая наценка (${state.markup}%):</span> <b>${totalProjectMarkup.toFixed(2)} ₽</b></div>
            <div class="summary-row"><span>УСН (${usnPercent}%):</span> <b>${usnCost.toFixed(2)} ₽</b></div>
            <div class="summary-row final" style="font-size: 20px;">
              <span>ИТОГОВАЯ СТОИМОСТЬ ЛЕСТНИЦЫ:</span> <span>${finalGrandTotal.toFixed(2)} ₽</span>
            </div>
          </div>
        `;

        document.getElementById('techCardBody').innerHTML = htmlBlocks;

      } catch (error) {
        document.getElementById('techCardBody').innerHTML = `<div class="error-box"><b>Ошибка:</b><br>${error.message}<br><br><pre>${error.stack}</pre></div>`;
        console.error(error);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
