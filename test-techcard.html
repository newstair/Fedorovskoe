<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест Техкарты</title>
  <style>
    :root { --accent: #5b8cff; --bg: #0f1116; --card-bg: #1a1d25; --border: #333; --text: #fff; --text-muted: #aaa; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }
    
    .modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; max-width: 1000px; margin: 0 auto; overflow: hidden; }
    .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px; }
    
    .block-card { background: #15171e; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
    .block-header { background: rgba(91, 140, 255, 0.1); padding: 12px 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .block-title { font-size: 16px; font-weight: bold; color: var(--accent); }
    .block-meta { font-size: 12px; background: #333; padding: 4px 8px; border-radius: 4px; }
    
    .sub-title { font-size: 14px; font-weight: bold; color: #aaa; margin: 20px 0 10px; border-bottom: 1px dashed #444; padding-bottom: 5px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; table-layout: fixed; }
    th { text-align: left; padding: 8px; background: #222; color: #aaa; border: 1px solid #444; font-weight: normal; word-break: break-word; }
    td { padding: 8px; border: 1px solid #444; word-break: break-word; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    
    .summary { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; border: 1px solid #444; margin-top: 20px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .summary-row.total { color: #ff9f43; font-size: 15px; font-weight: bold; border-top: 1px dashed #555; padding-top: 8px; }
    .summary-row.final { color: #31d0aa; font-size: 18px; font-weight: bold; margin-top: 10px; }
    
    .controls { display: flex; align-items: center; gap: 10px; }
    .controls input[type="number"] { background: #0f1116; border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px; width: 80px; text-align: right; }
    .controls input[type="number"]:focus { outline: none; border-color: var(--accent); }
    
    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    .error-box { background: #ff4444; color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>

  <div class="modal">
    <div class="modal-header">
      <h2 style="margin: 0; font-size: 20px;">📊 Технологическая карта (Финальный тест)</h2>
    </div>
    <div class="modal-body" id="techCardBody">
      <div style="text-align: center; color: #aaa; padding: 20px;">Загрузка данных...</div>
    </div>
  </div>

  <div class="footer">
    <div style="display: flex; gap: 20px; align-items: center;">
      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="globalUsn" onchange="renderTechCard()"> Применить УСН 6%
      </label>
      <div style="font-size: 16px; font-weight: bold;">
        ИТОГО: <span id="grandTotal" style="color: #31d0aa;">0.00 ₽</span>
      </div>
    </div>
    <button class="btn">🖨️ Печать</button>
  </div>

  <script>
    const xmlString = `
      <details>
        <detail name="1_Tr1">
          <type id="Step">Ступень</type>
          <attributes><attribute name="subtype" type="string" value="straight"/></attributes>
          <dim text="40 x 945 x 431"><length>945</length><width>431</width></dim>
          <material>PINE</material>
        </detail>
        <detail name="1_Tr2">
          <type id="Step">Ступень</type>
          <attributes><attribute name="subtype" type="string" value="winder"/></attributes>
          <dim text="40 x 1206 x 584"><length>1206</length><width>584</width></dim>
          <material>PINE</material>
        </detail>
      </details>
    `;

    const dxfAreas = { "1_Tr1": 0.35, "1_Tr2": 0.50 };

    let prices = null;
    
    // Глобальное состояние для интерактивных полей
    let state = {
      markup: null,
      mountAddon: 0,
      includePaint: true,
      includeMontage: true
    };

    async function init() {
      try {
        const res = await fetch('production_prices.json');
        if (!res.ok) throw new Error("Файл JSON не найден.");
        prices = await res.json();
        state.markup = prices.settings?.markup_percent || 40; // Берем из базы, если нет - 40
        renderTechCard();
      } catch (e) {
        document.getElementById('techCardBody').innerHTML = `<div class="error-box">Ошибка: ${e.message}</div>`;
      }
    }

    function renderTechCard() {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "text/xml");
        const details = xmlDoc.getElementsByTagName("detail");

        let blockItems = [];
        let totalArea = 0;
        let totalWood = 0;
        let totalGlue = 0, totalCncUp = 0, totalCncCut = 0, totalSanding = 0;

        for (let i = 0; i < details.length; i++) {
          const el = details[i];
          if (el.getElementsByTagName("type")[0].getAttribute("id") !== "Step") continue;

          const name = el.getAttribute("name");
          const subtype = el.getElementsByTagName("attribute")[0] ? el.getElementsByTagName("attribute")[0].getAttribute("value") : "straight";
          const length = parseFloat(el.getElementsByTagName("length")[0].textContent);
          const width = parseFloat(el.getElementsByTagName("width")[0].textContent);
          
          const materialKey = "pine"; 
          const woodName = prices.woods[materialKey] ? prices.woods[materialKey].name : "Сосна";

          const lathsCount = Math.ceil(width / 45);
          const purchaseLength = Math.ceil((length + 100) / 50) * 50;
          const volume = (purchaseLength * 50 * 50 * lathsCount) / 1000000000; 
          
          const coefType = subtype === "winder" ? "Step_winder" : "Step_straight";
          const complexityCoef = prices.detail_coefficients[coefType] ? prices.detail_coefficients[coefType].coef : 1.0;
          const woodCoef = prices.woods[materialKey] ? prices.woods[materialKey].workCoef : 1.0;
          
          const area = dxfAreas[name] || 0;
          const paintArea = area * 2;
          totalArea += paintArea;

          const woodPrice = prices.woods[materialKey] ? prices.woods[materialKey].pricePerM3 : 0;
          const woodCost = volume * woodPrice;
          totalWood += woodCost;

          const glueKey = purchaseLength > 2000 ? "glue_long" : "glue_short";
          const cGlue = (prices.works[glueKey]?.perUnit || 0) * paintArea * complexityCoef * woodCoef;
          const cCncUp = (prices.works.cnc_programming?.perUnit || 0) * complexityCoef;
          const cCncCut = (prices.works.cnc_cutting?.perUnit || 0) * complexityCoef;
          const cSanding = (prices.works.sanding?.perUnit || 0) * paintArea * complexityCoef * woodCoef;

          totalGlue += cGlue; totalCncUp += cCncUp; totalCncCut += cCncCut; totalSanding += cSanding;

          blockItems.push({
            name, subtype, woodName, 
            dims: `${length}×${width}×40`, 
            lathDims: `50×50×${purchaseLength}`, 
            lathsCount, volume, woodCost
          });
        }

        // === ПОКРАСКА ===
        let recipe = Object.values(prices.paint_recipes || {}).find(r => r.name.includes("Белый")) || Object.values(prices.paint_recipes || {})[0];
        let paintCostTotal = 0;
        let paintDetailsHTML = '';

        if (recipe) {
          const processPaintBlock = (block, title) => {
            if (!block || !block.enabled) return '';
            
            let totalVol = 0, totalPrice = 0;
            block.components.forEach(c => {
              totalVol += c.volume;
              const inv = prices.paint_inventory[c.component];
              if (inv) totalPrice += (c.volume * (inv.pricePerLiter / 1000));
            });

            const mixtureNeeded = block.consumption * totalArea;
            const pricePerMl = totalVol > 0 ? totalPrice / totalVol : 0;
            const blockCost = pricePerMl * mixtureNeeded;
            paintCostTotal += blockCost;

            let rows = '';
            block.components.forEach(c => {
              const inv = prices.paint_inventory[c.component];
              if (!inv) return;
              const proportion = c.volume / totalVol;
              const compVolUsed = mixtureNeeded * proportion;
              const compCost = compVolUsed * (inv.pricePerLiter / 1000);
              rows += `<tr>
                <td style="padding-left:20px;">${inv.name}</td>
                <td>${compVolUsed.toFixed(1)} мл</td>
                <td class="text-right">${compCost.toFixed(2)} ₽</td>
              </tr>`;
            });

            return `
              <tr style="background:#222;">
                <td colspan="2"><b>${title} (Расход: ${block.consumption} мл/м²)</b></td>
                <td class="text-right"><b>${blockCost.toFixed(2)} ₽</b></td>
              </tr>
              ${rows}
            `;
          };

          paintDetailsHTML += processPaintBlock(recipe.stain, '1. Тонировка');
          paintDetailsHTML += processPaintBlock(recipe.primer, '2. Грунт');
          paintDetailsHTML += processPaintBlock(recipe.lacquer, '3. Лак');
        }

        // === СВОДКА И РАСЧЕТЫ ===
        const totalWorks = totalGlue + totalCncUp + totalCncCut + totalSanding;
        
        // Накладные
        const overheadsPerM2 = (prices.overheads?.production_norm_m2_per_day) ? ((prices.overheads.rent + (prices.overheads.electricity_price * prices.overheads.electricity_usage_kw * prices.overheads.working_days_per_month)) / (prices.overheads.production_norm_m2_per_day * prices.overheads.working_days_per_month)) : 0;
        const overheadsCost = overheadsPerM2 * totalArea;

        // БАЗОВАЯ СЕБЕСТОИМОСТЬ (Дерево + Работы + Накладные)
        const baseCost = totalWood + totalWorks + overheadsCost;

        // МОНТАЖ
        const mountingBaseCost = (prices.works.mounting?.base || 0) + ((prices.works.mounting?.perUnit || 0) * totalArea);
        const activeMontage = state.includeMontage ? (mountingBaseCost + state.mountAddon) : 0;

        // ПОКРАСКА
        const activePaint = state.includePaint ? paintCostTotal : 0;

        // ИТОГО ДО НАЦЕНКИ (Сумма всех активных опций)
        const totalBeforeMarkup = baseCost + activePaint + activeMontage;

        // НАЦЕНКА
        const markupCost = totalBeforeMarkup * (state.markup / 100);
        
        // УСН
        const usnPercent = prices.settings?.usn_percent || 6;
        const usnEnabled = document.getElementById('globalUsn').checked;
        const usnCost = usnEnabled ? (totalBeforeMarkup + markupCost) * (usnPercent / 100) : 0;
        
        // ФИНАЛЬНАЯ ЦЕНА
        const finalPrice = totalBeforeMarkup + markupCost + usnCost;

        document.getElementById('grandTotal').innerText = finalPrice.toFixed(2) + ' ₽';

        // === РЕНДЕР HTML ===
        let rowsHTML = '';
        blockItems.forEach(item => {
          rowsHTML += `<tr>
            <td>${item.name}</td>
            <td>${item.subtype === 'winder' ? 'Забежная' : 'Прямая'}</td>
            <td>${item.woodName}</td>
            <td>${item.dims}</td>
            <td class="text-center">${item.lathDims}</td>
            <td class="text-center">${item.lathsCount} шт</td>
            <td>${item.volume.toFixed(4)}</td>
            <td class="text-right">${item.woodCost.toFixed(2)} ₽</td>
          </tr>`;
        });

        const html = `
          <div class="block-card">
            <div class="block-header">
              <div class="block-title">📦 БЛОК: СТУПЕНИ (${blockItems.length} шт)</div>
              <div class="block-meta">🎨 Покраска: ${recipe ? recipe.name : 'Не выбрана'}</div>
            </div>
            <div style="padding: 15px;">
              
              <div class="sub-title">1. Детали и Дерево</div>
              <table>
                <tr>
                  <th>Деталь</th><th>Тип</th><th>Дерево</th><th>Щит (мм)</th>
                  <th class="text-center">Брусок (мм)</th><th class="text-center">Шт в щите</th>
                  <th>Объем (м³)</th><th class="text-right">Стоимость</th>
                </tr>
                ${rowsHTML}
              </table>

              <div class="sub-title">2. Работы</div>
              <table>
                <tr><th>Операция</th><th>Ед. изм.</th><th class="text-right">Стоимость</th></tr>
                <tr><td>Склейка</td><td>${totalArea.toFixed(2)} м²</td><td class="text-right">${totalGlue.toFixed(2)} ₽</td></tr>
                <tr><td>Создание УП (ЧПУ)</td><td>${blockItems.length} шт</td><td class="text-right">${totalCncUp.toFixed(2)} ₽</td></tr>
                <tr><td>ЧПУ Резка (Станок)</td><td>${blockItems.length} шт</td><td class="text-right">${totalCncCut.toFixed(2)} ₽</td></tr>
                <tr><td>Шлифовка</td><td>${totalArea.toFixed(2)} м²</td><td class="text-right">${totalSanding.toFixed(2)} ₽</td></tr>
              </table>

              <div class="sub-title">3. Покраска (${recipe ? recipe.name : 'Без покраски'})</div>
              <table>
                <tr><th>Компонент / Этап</th><th>Реальный объем (на блок)</th><th class="text-right">Стоимость</th></tr>
                ${paintDetailsHTML || '<tr><td colspan="3" style="text-align:center; color:#aaa;">Рецепт не выбран или отключен</td></tr>'}
              </table>

              <div class="summary">
                <div class="summary-row" style="border-bottom: 1px dashed #555; padding-bottom: 8px;">
                  <span style="color:#aaa;">Базовая себестоимость (Дерево + Работы + Накладные):</span> 
                  <b>${baseCost.toFixed(2)} ₽</b>
                </div>
                <div class="summary-row"><span>В т.ч. Дерево:</span> <b>${totalWood.toFixed(2)} ₽</b></div>
                <div class="summary-row"><span>В т.ч. Работы:</span> <b>${totalWorks.toFixed(2)} ₽</b></div>
                <div class="summary-row" style="margin-bottom: 15px;"><span>В т.ч. Накладные:</span> <b>${overheadsCost.toFixed(2)} ₽</b></div>

                <!-- ОПЦИИ -->
                <div class="summary-row" style="align-items: center; background: rgba(255,255,255,0.02); padding: 5px; border-radius: 4px;">
                  <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; color: #ff9f43;">
                    <input type="checkbox" id="chkPaint" ${state.includePaint ? 'checked' : ''} onchange="toggleOption('includePaint', this.checked)"> 
                    Стоимость покраски:
                  </label>
                  <b>${paintCostTotal.toFixed(2)} ₽</b>
                </div>

                <div class="summary-row" style="align-items: center; background: rgba(255,255,255,0.02); padding: 5px; border-radius: 4px;">
                  <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; color: #ff9f43;">
                    <input type="checkbox" id="chkMount" ${state.includeMontage ? 'checked' : ''} onchange="toggleOption('includeMontage', this.checked)"> 
                    Стоимость монтажа:
                  </label>
                  <div class="controls">
                    <b>${mountingBaseCost.toFixed(2)} ₽</b>
                    <span style="font-size:11px; color:#aaa;">+ надбавка:</span>
                    <input type="number" value="${state.mountAddon}" onchange="updateMountAddon(this.value)" ${!state.includeMontage ? 'disabled' : ''}>
                  </div>
                </div>

                <div class="summary-row total" style="margin-top: 15px;">
                  <span>ИТОГО СЕБЕСТОИМОСТЬ:</span> <span>${totalBeforeMarkup.toFixed(2)} ₽</span>
                </div>
                
                <div class="summary-row" style="align-items: center;">
                  <span>Наценка (%):</span> 
                  <div class="controls">
                    <input type="number" value="${state.markup}" onchange="updateMarkup(this.value)" style="width: 60px;">
                  </div>
                </div>
                <div class="summary-row">
                  <span>Сумма наценки:</span> <span>${markupCost.toFixed(2)} ₽</span>
                </div>

                <div class="summary-row">
                  <span>УСН (${usnPercent}%):</span> <span id="usnDisplay">${usnCost.toFixed(2)} ₽</span>
                </div>
                <div class="summary-row final">
                  <span>🔥 ЦЕНА В КАЛЬКУЛЯТОР:</span> <span id="finalPriceDisplay">${finalPrice.toFixed(2)} ₽</span>
                </div>
              </div>

            </div>
          </div>
        `;

        document.getElementById('techCardBody').innerHTML = html;

      } catch (error) {
        document.getElementById('techCardBody').innerHTML = `<div class="error-box"><b>Ошибка:</b><br>${error.message}<br><br><pre>${error.stack}</pre></div>`;
        console.error(error);
      }
    }

    // Обновление состояний
    function updateMarkup(val) { state.markup = parseFloat(val) || 0; renderTechCard(); }
    function updateMountAddon(val) { state.mountAddon = parseFloat(val) || 0; renderTechCard(); }
    function toggleOption(option, val) { state[option] = val; renderTechCard(); }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
