<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки производства</title>
  <style>
    :root { --accent: #5b8cff; --bg: #0f1116; --card-bg: #1a1d25; --border: #333; --text: #fff; --text-muted: #aaa; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; }
    h2 { color: var(--accent); margin-top: 0; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .tab-btn:hover { background: #222; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .section-title { font-size: 16px; font-weight: bold; color: var(--accent); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed #444; padding-bottom: 10px; }
    
    .btn-add { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: 0.2s; }
    .btn-add:hover { background: var(--accent); color: #fff; }
    .btn-del { background: #ff4444; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    .input-group { display: flex; flex-direction: column; gap: 5px; }
    .input-group label { font-size: 13px; color: var(--text-muted); }
    
    input, select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }

    /* Стили для рецептов */
    .recipe-card { background: #15171e; border: 1px solid #444; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .recipe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 15px; }
    
    .sub-block { background: #1e222d; border-radius: 6px; padding: 15px; margin-bottom: 15px; border-left: 3px solid var(--accent); }
    .sub-block-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .sub-block-title { font-weight: bold; color: #fff; font-size: 15px; display: flex; align-items: center; gap: 10px; }
    
    .component-row { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 10px; }
    .component-row .input-group { flex: 1; }
    
    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .status { font-size: 14px; color: var(--text-muted); }
    .btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .btn:hover { opacity: 0.9; }
    .btn-success { background: #31d0aa; color: #000; }
  </style>
</head>
<body>
  <h2>⚙️ Настройки производства (Себестоимость)</h2>
  
  <div class="tabs" id="tabsContainer">
    <button class="tab-btn active" onclick="switchTab('woods', this)">🌲 Древесина</button>
    <button class="tab-btn" onclick="switchTab('works', this)">🛠️ Работы</button>
    <button class="tab-btn" onclick="switchTab('paint', this)">🎨 Покраска</button>
    <button class="tab-btn" onclick="switchTab('details', this)">📐 Детали и Фурнитура</button>
    <button class="tab-btn" onclick="switchTab('overheads', this)">🏢 Накладные</button>
  </div>

  <div id="content"></div>

  <div class="footer">
    <div class="status" id="statusText">Данные загружены</div>
    <div style="display: flex; gap: 10px;">
      <button class="btn btn-success" onclick="exportJSON()">⬇️ Скачать JSON</button>
      <button class="btn" style="background: #333; border: 1px solid #444;" onclick="closeAdmin()">❌ Закрыть</button>
    </div>
  </div>

  <script>
    let data = null;
    let currentTab = 'woods';
    const BLOCK_NAMES = { stain: '1. Тонировка', primer: '2. Грунт', lacquer: '3. Лак' };

    async function loadData() {
      try {
        const res = await fetch('production_prices.json');
        data = await res.json();
        if(!data.settings) data.settings = { loss_board_percent: 0, loss_beam_percent: 0, markup_percent: 0, usn_percent: 0 };
        if(!data.overheads) data.overheads = { rent: 0, working_days_per_month: 0, electricity_price: 0, electricity_usage_kw: 0, production_norm_m2_per_day: 0 };
        if(!data.paint_recipes) data.paint_recipes = {};
        
        document.getElementById('statusText').innerText = 'Данные загружены';
        document.getElementById('statusText').style.color = '#aaa';
        render();
      } catch (e) {
        document.getElementById('statusText').innerText = 'Ошибка загрузки JSON.';
        document.getElementById('statusText').style.color = '#ff4444';
        console.error(e);
      }
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function markDirty() {
      document.getElementById('statusText').innerText = 'Есть несохраненные изменения...';
      document.getElementById('statusText').style.color = '#ff9f43';
    }

    function render() {
      const c = document.getElementById('content');
      let html = '';

      if (currentTab === 'woods') {
        // ... (код для woods и works остался без изменений, я его скрыл для экономии места, но в файле он есть) ...
        html += `<div class="section"><div class="section-title">📦 Стоимость дерева (за м³) <button class="btn-add" onclick="addNew('woods')">+ Добавить</button></div><div class="grid-2">`;
        for (const [key, item] of Object.entries(data.woods || {})) {
          html += `<div class="input-group"><label>${item.name}</label><input type="number" value="${item.pricePerM3}" onchange="update('woods','${key}','pricePerM3',this.value)"></div>`;
        }
        html += `</div></div>`;
      }

      if (currentTab === 'works') {
        html += `<div class="section"><div class="section-title">🛠️ Базовые работы <button class="btn-add" onclick="addNew('works')">+ Добавить</button></div><div class="grid-2">`;
        for (const [key, item] of Object.entries(data.works || {})) {
          html += `<div class="input-group"><label>${item.name} (₽)</label><input type="number" value="${item.perUnit}" onchange="update('works','${key}','perUnit',this.value)"></div>`;
        }
        html += `</div></div>`;
      }

      if (currentTab === 'paint') {
        // Склад
        html += `<div class="section">
          <div class="section-title">🎨 Склад (Цена за 1 литр) <button class="btn-add" onclick="addNew('paint_inventory')">+ Добавить</button></div>
          <div class="grid-3">`;
        for (const [key, item] of Object.entries(data.paint_inventory || {})) {
          html += `<div class="input-group"><label>${item.name}</label>
            <input type="number" step="0.01" value="${item.pricePerLiter || 0}" onchange="update('paint_inventory','${key}','pricePerLiter',this.value)">
          </div>`;
        }
        html += `</div></div>`;

        // Рецепты
        html += `<div class="section">
          <div class="section-title">🧪 Конструктор рецептов <button class="btn-add" onclick="addRecipe()">+ Создать рецепт</button></div>`;
        
        for (const [recipeId, recipe] of Object.entries(data.paint_recipes || {})) {
          html += `<div class="recipe-card">
            <div class="recipe-header">
              <input type="text" style="width: 50%; font-size: 16px; font-weight: bold; color: #fff; background: transparent; border: none; border-bottom: 1px solid #444;" value="${recipe.name}" onchange="updateRecipeName('${recipeId}', this.value)" title="Название рецепта">
              <button class="btn-del" onclick="removeRecipe('${recipeId}')">🗑️ Удалить рецепт</button>
            </div>`;

          // Перебираем 3 фиксированных подблока
          ['stain', 'primer', 'lacquer'].forEach(blockType => {
            const block = recipe[blockType] || { enabled: true, consumption: 0, components: [] };
            
            // Если подблока нет в данных, создаем его структуру
            if (!recipe[blockType]) {
              recipe[blockType] = block;
            }

            html += `<div class="sub-block" style="${!block.enabled ? 'opacity: 0.5;' : ''}">
              <div class="sub-block-header">
                <div class="sub-block-title">
                  ${BLOCK_NAMES[blockType]}
                  ${blockType === 'stain' ? `<label style="font-size: 12px; color: #aaa; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" ${block.enabled ? 'checked' : ''} onchange="toggleBlock('${recipeId}', '${blockType}', this.checked)"> Использовать
                  </label>` : ''}
                </div>
                ${block.enabled ? `<div style="display: flex; align-items: center; gap: 10px;">
                  <span style="font-size: 12px; color: #ff9f43; font-weight: bold;">🔥 Общий расход:</span>
                  <input type="number" style="width: 80px; text-align: center;" value="${block.consumption}" onchange="updateBlockConsumption('${recipeId}', '${blockType}', this.value)"> мл/м²
                </div>` : '<span style="color: #ff4444; font-size: 12px;">Отключено</span>'}
              </div>`;

              if (block.enabled) {
                html += `<div class="components-container">`;
                block.components.forEach((comp, index) => {
                  let options = '';
                  for (const [invKey, invItem] of Object.entries(data.paint_inventory)) {
                    const selected = (comp.component === invKey) ? 'selected' : '';
                    options += `<option value="${invKey}" ${selected}>${invItem.name}</option>`;
                  }

                  html += `<div class="component-row">
                    <div class="input-group">
                      <select onchange="updateComponent('${recipeId}', '${blockType}', ${index}, 'component', this.value)">${options}</select>
                    </div>
                    <div class="input-group" style="max-width: 120px;">
                      <input type="number" value="${comp.volume}" placeholder="Объем (мл)" onchange="updateComponent('${recipeId}', '${blockType}', ${index}, 'volume', this.value)">
                    </div>
                    <button class="btn-del" style="height: 36px; margin-bottom: 2px;" onclick="removeComponent('${recipeId}', '${blockType}', ${index})">✕</button>
                  </div>`;
                });
                html += `</div>
                  <button class="btn-add" style="margin-top: 5px;" onclick="addComponent('${recipeId}', '${blockType}')">+ Добавить компонент</button>`;
              }
              
              html += `</div>`; // закрываем sub-block
          });

          html += `</div>`; // закрываем recipe-card
        }
        html += `</div>`;
      }

      if (currentTab === 'details') {
        html += `<div class="section"><div class="section-title">🔩 Фурнитура <button class="btn-add" onclick="addNew('hardware')">+ Добавить</button></div><div class="grid-2">`;
        for (const [key, item] of Object.entries(data.hardware || {})) {
          const price = item.pricePerPcs || item.pricePerKg || 0;
          const field = item.pricePerPcs ? 'pricePerPcs' : 'pricePerKg';
          html += `<div class="input-group"><label>${item.name} (₽)</label><input type="number" value="${price}" onchange="update('hardware','${key}','${field}',this.value)"></div>`;
        }
        html += `</div></div>`;
      }

      if (currentTab === 'overheads') {
        html += `<div class="section"><div class="section-title">🏢 Накладные расходы</div><div class="grid-2">
          <div class="input-group"><label>Аренда (₽/мес)</label><input type="number" value="${data.overheads.rent}" onchange="update('overheads','rent','',this.value)"></div>
          <div class="input-group"><label>Раб. дней в мес</label><input type="number" value="${data.overheads.working_days_per_month}" onchange="update('overheads','working_days_per_month','',this.value)"></div>
          <div class="input-group"><label>Свет (₽/кВт)</label><input type="number" value="${data.overheads.electricity_price}" onchange="update('overheads','electricity_price','',this.value)"></div>
          <div class="input-group"><label>Расход (кВт/день)</label><input type="number" value="${data.overheads.electricity_usage_kw}" onchange="update('overheads','electricity_usage_kw','',this.value)"></div>
          <div class="input-group"><label>Норма (м²/день)</label><input type="number" value="${data.overheads.production_norm_m2_per_day}" onchange="update('overheads','production_norm_m2_per_day','',this.value)"></div>
        </div></div>`;
      }

      c.innerHTML = html;
    }

    // --- ФУНКЦИИ ДЛЯ РЕЦЕПТОВ ---
    function addRecipe() {
      const name = prompt('Введите название нового рецепта (например, "Дуб тонированный"):');
      if (name) {
        const id = 'recipe_' + Date.now();
        // Создаем пустой каркас из трех блоков
        data.paint_recipes[id] = {
          name: name,
          stain: { enabled: true, consumption: 0, components: [] },
          primer: { enabled: true, consumption: 0, components: [] },
          lacquer: { enabled: true, consumption: 0, components: [] }
        };
        render();
        markDirty();
      }
    }

    function removeRecipe(recipeId) {
      if (confirm('Вы уверены, что хотите удалить этот рецепт?')) {
        delete data.paint_recipes[recipeId];
        render();
        markDirty();
      }
    }

    function updateRecipeName(recipeId, value) {
      data.paint_recipes[recipeId].name = value;
      markDirty();
    }

    function toggleBlock(recipeId, blockType, isEnabled) {
      data.paint_recipes[recipeId][blockType].enabled = isEnabled;
      render();
      markDirty();
    }

    function updateBlockConsumption(recipeId, blockType, value) {
      data.paint_recipes[recipeId][blockType].consumption = parseFloat(value) || 0;
      markDirty();
    }

    function addComponent(recipeId, blockType) {
      data.paint_recipes[recipeId][blockType].components.push({ component: '', volume: 0 });
      render();
      markDirty();
    }

    function removeComponent(recipeId, blockType, index) {
      data.paint_recipes[recipeId][blockType].components.splice(index, 1);
      render();
      markDirty();
    }

    function updateComponent(recipeId, blockType, index, field, value) {
      const comp = data.paint_recipes[recipeId][blockType].components[index];
      if (field === 'component') { comp.component = value; } 
      else { comp[field] = parseFloat(value) || 0; }
      markDirty();
    }

    // --- ОБЩИЕ ФУНКЦИИ ---
    function addNew(section) {
      const name = prompt('Введите название новой позиции:');
      if (name) {
        const key = 'new_' + Date.now();
        if (section === 'woods') data.woods[key] = { name: name, pricePerM3: 0, workCoef: 1.0 };
        if (section === 'works') data.works[key] = { name: name, unit: 'm2', base: 0, perUnit: 0 };
        if (section === 'paint_inventory') data.paint_inventory[key] = { name: name, unit: 'l', pricePerLiter: 0 };
        if (section === 'hardware') data.hardware[key] = { name: name, pricePerPcs: 0 };
        render();
        markDirty();
      }
    }

    function update(section, key, field, value) {
      if (data[section] && data[section][key]) {
        if (field) { data[section][key][field] = parseFloat(value) || 0; } 
        else { data[section][key] = parseFloat(value) || 0; }
        markDirty();
      }
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'production_prices.json';
      a.click();
      URL.revokeObjectURL(url);
      document.getElementById('statusText').innerText = 'Файл скачан! Замените его в GitHub.';
      document.getElementById('statusText').style.color = '#31d0aa';
    }

    function closeAdmin() {
      window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
